<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mindmap PPT Demo</title>
    <style>
:root {
  --node-image-thumb-width: 161px;
  --node-image-thumb-height: 84px;
  --node-image-expanded-width: 437px;
  --node-image-expanded-height: 480px;
  --node-image-max-ratio: 0.45;
  --active-node-scale: 1.5;
  color: #172033;
  background: #fcfcf8;
  font-family:
    Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
    "PingFang SC", "Microsoft YaHei", sans-serif;
  font-synthesis: none;
  text-rendering: optimizeLegibility;
}

* {
  box-sizing: border-box;
}

body {
  min-width: 320px;
  min-height: 100vh;
  margin: 0;
  background: linear-gradient(180deg, #ffffff 0%, #fbfbf7 100%);
}

button {
  font: inherit;
}

body.image-viewer-open {
  overflow: hidden;
}

.app-shell {
  width: 100vw;
  height: 100vh;
  min-height: 100vh;
  margin: 0;
}

.eyebrow {
  margin: 0 0 5px;
  color: #6b745d;
  font-size: 0.78rem;
  font-weight: 800;
  letter-spacing: 0;
  text-transform: uppercase;
}

h1 {
  margin: 0;
  color: #182033;
  font-size: clamp(1.6rem, 2.4vw, 2.7rem);
  line-height: 1.04;
  white-space: pre-line;
}

.control-main {
  --slider-readout-gap: 14px;
  --slider-readout-width: 72px;
  --zoom-control-pad-x: 12px;
  --control-readout-right: 42px;
  display: grid;
  grid-template-rows: 34px auto;
  gap: 8px;
  min-width: 0;
  transition:
    opacity 220ms ease,
    transform 260ms cubic-bezier(0.22, 1, 0.36, 1);
}

.node-scrubber {
  display: grid;
  grid-template-columns: minmax(0, 1fr) var(--slider-readout-width) auto;
  align-items: center;
  gap: var(--slider-readout-gap);
  min-width: 0;
  height: 34px;
  padding-right: 0;
}

#nodeSlider {
  --slider-progress: 0%;
  appearance: none;
  width: 100%;
  height: 28px;
  margin: 0;
  border-radius: 999px;
  background: transparent;
  cursor: pointer;
}

#nodeSlider::-webkit-slider-runnable-track {
  height: 8px;
  border: 1px solid rgba(31, 52, 56, 0.12);
  border-radius: 999px;
  background:
    linear-gradient(90deg, #183a4a 0 var(--slider-progress), rgba(224, 231, 224, 0.9) var(--slider-progress) 100%);
  box-shadow: inset 0 1px 2px rgba(24, 36, 42, 0.1);
}

#nodeSlider::-moz-range-track {
  height: 8px;
  border: 1px solid rgba(31, 52, 56, 0.12);
  border-radius: 999px;
  background:
    linear-gradient(90deg, #183a4a 0 var(--slider-progress), rgba(224, 231, 224, 0.9) var(--slider-progress) 100%);
  box-shadow: inset 0 1px 2px rgba(24, 36, 42, 0.1);
}

#nodeSlider::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: -7px;
  border: 3px solid #ffffff;
  border-radius: 999px;
  background: #d8894f;
  box-shadow:
    0 4px 12px rgba(24, 36, 42, 0.2),
    0 0 0 1px rgba(161, 86, 43, 0.26);
}

#nodeSlider::-moz-range-thumb {
  width: 14px;
  height: 14px;
  border: 3px solid #ffffff;
  border-radius: 999px;
  background: #d8894f;
  box-shadow:
    0 4px 12px rgba(24, 36, 42, 0.2),
    0 0 0 1px rgba(161, 86, 43, 0.26);
}

#nodeSlider:focus-visible {
  outline: none;
}

#nodeSlider:focus-visible::-webkit-slider-thumb {
  box-shadow:
    0 4px 12px rgba(24, 36, 42, 0.2),
    0 0 0 1px rgba(161, 86, 43, 0.26),
    0 0 0 4px rgba(216, 137, 79, 0.2);
}

#nodeSlider:focus-visible::-moz-range-thumb {
  box-shadow:
    0 4px 12px rgba(24, 36, 42, 0.2),
    0 0 0 1px rgba(161, 86, 43, 0.26),
    0 0 0 4px rgba(216, 137, 79, 0.2);
}

.counter {
  min-width: var(--slider-readout-width);
  color: #515d66;
  font-size: 0.94rem;
  font-weight: 800;
  text-align: right;
}

.expand-all-button {
  display: inline-grid;
  place-items: center;
  min-width: 72px;
  height: 28px;
  padding: 0 12px;
  border: 1px solid rgba(24, 58, 74, 0.14);
  border-radius: 8px;
  color: #fffdf8;
  background: #183a4a;
  box-shadow: 0 6px 14px rgba(24, 36, 42, 0.12);
  cursor: pointer;
  font-size: 0.84rem;
  font-weight: 850;
  line-height: 1;
  white-space: nowrap;
  transition:
    background-color 180ms ease,
    border-color 180ms ease,
    opacity 180ms ease,
    transform 180ms ease;
}

.expand-all-button:hover,
.expand-all-button:focus-visible {
  border-color: rgba(216, 137, 79, 0.48);
  background: #214b5e;
}

.expand-all-button:focus-visible {
  outline: 3px solid rgba(216, 137, 79, 0.22);
  outline-offset: 2px;
}

.expand-all-button:disabled {
  cursor: default;
  opacity: 0.55;
  transform: none;
}

.node-readout {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
  min-width: 0;
}

.readout-card,
.zoom-control {
  min-width: 0;
  border: 1px solid rgba(255, 255, 255, 0.24);
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.28);
}

.readout-card {
  display: flex;
  align-items: stretch;
  min-height: 68px;
  padding: 0;
  gap: 0;
  overflow: hidden;
  background: rgba(255, 255, 255, 0.3);
  border-color: rgba(255, 255, 255, 0.2);
}

.readout-icon {
  display: grid;
  flex: 0 0 56px;
  place-items: center;
  padding: 10px 0;
  border-right: 1px solid rgba(24, 58, 74, 0.08);
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.3), rgba(247, 248, 245, 0.16));
}

.letter-grid {
  --letter-grid-size: 34px;
  --letter-grid-gap: 5px;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  grid-auto-rows: 1fr;
  place-items: center;
  width: var(--letter-grid-size);
  height: var(--letter-grid-size);
  gap: var(--letter-grid-gap);
  color: #7d8775;
}

.letter-grid span {
  font-size: 0.7rem;
  font-weight: 900;
  line-height: 1;
  letter-spacing: 0;
}

.readout-card .node-content {
  flex: 1 1 auto;
  min-width: 0;
  min-height: 100%;
  padding: 11px 18px 13px;
  border: 0;
  border-radius: 0;
  background: transparent;
  box-shadow: none;
  text-align: left;
  white-space: normal;
  place-items: start;
  align-content: center;
  transform: none;
}

.readout-card .node-subtitle,
.readout-card .node-title {
  display: block;
  width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.readout-card .node-title {
  font-size: 1rem;
  line-height: 1.28;
}

.zoom-control {
  display: grid;
  grid-template-columns: 32px minmax(0, 1fr);
  align-items: center;
  gap: var(--slider-readout-gap);
  min-height: 68px;
  padding: 0 var(--control-readout-right) 0 var(--zoom-control-pad-x);
}

.zoom-icon {
  display: grid;
  align-self: stretch;
  justify-self: center;
  place-items: center;
}

.zoom-fields {
  display: grid;
  gap: 6px;
  min-width: 0;
}

.zoom-row {
  display: grid;
  grid-template-columns: minmax(120px, 1fr) minmax(5ch, calc(var(--slider-readout-width) - var(--zoom-control-pad-x) + 1.5ch));
  align-items: center;
  gap: 9px;
  min-width: 0;
}

.zoom-control input {
  appearance: none;
  width: 100%;
  height: 22px;
  margin: 0;
  background: transparent;
  cursor: pointer;
}

.zoom-control input::-webkit-slider-runnable-track {
  height: 7px;
  border: 1px solid rgba(31, 52, 56, 0.12);
  border-radius: 999px;
  background: rgba(224, 231, 224, 0.9);
}

.zoom-control input::-moz-range-track {
  height: 7px;
  border: 1px solid rgba(31, 52, 56, 0.12);
  border-radius: 999px;
  background: rgba(224, 231, 224, 0.9);
}

.zoom-control input::-webkit-slider-thumb {
  appearance: none;
  width: 17px;
  height: 17px;
  margin-top: -6px;
  border: 3px solid #ffffff;
  border-radius: 999px;
  background: #183a4a;
  box-shadow: 0 3px 10px rgba(24, 36, 42, 0.18);
}

.zoom-control input::-moz-range-thumb {
  width: 11px;
  height: 11px;
  border: 3px solid #ffffff;
  border-radius: 999px;
  background: #183a4a;
  box-shadow: 0 3px 10px rgba(24, 36, 42, 0.18);
}

.zoom-control strong {
  min-width: 4.5ch;
  overflow: visible;
  color: #172033;
  font-size: 0.95rem;
  font-weight: 850;
  font-variant-numeric: tabular-nums;
  text-align: right;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.control-hint {
  margin: 8px 0 0;
  padding-right: var(--control-readout-right);
  color: rgba(81, 93, 102, 0.78);
  font-size: 0.78rem;
  font-weight: 750;
  line-height: 1.25;
  text-align: right;
}

.presentation-frame {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  width: 100%;
  height: 100%;
  min-height: 100vh;
  background:
    radial-gradient(circle at 18% 18%, rgba(226, 236, 242, 0.28) 0%, rgba(226, 236, 242, 0.14) 18%, rgba(255, 255, 255, 0) 34%),
    radial-gradient(circle at 82% 78%, rgba(247, 231, 213, 0.24) 0%, rgba(247, 231, 213, 0.11) 16%, rgba(255, 255, 255, 0) 30%),
    linear-gradient(180deg, rgba(255, 255, 255, 0.992), rgba(251, 251, 247, 0.972));
}

.presentation-frame::before,
.presentation-frame::after,
#mindmap::before,
#mindmap::after {
  content: "";
  position: absolute;
  border-radius: 999px;
  pointer-events: none;
  z-index: 0;
  filter: blur(26px);
  opacity: 0.9;
  will-change: transform;
}

.presentation-frame::before {
  top: -12vh;
  left: -8vw;
  width: min(48vw, 760px);
  height: min(48vw, 760px);
  background:
    radial-gradient(circle, rgba(219, 233, 241, 0.6) 0%, rgba(219, 233, 241, 0.34) 24%, rgba(219, 233, 241, 0.12) 40%, rgba(255, 255, 255, 0) 64%);
  animation: background-orbit-a 18s linear infinite;
}

.presentation-frame::after {
  top: -12vh;
  right: -8vw;
  width: min(44vw, 700px);
  height: min(44vw, 700px);
  background:
    radial-gradient(circle, rgba(247, 228, 206, 0.58) 0%, rgba(247, 228, 206, 0.3) 24%, rgba(247, 228, 206, 0.12) 40%, rgba(255, 255, 255, 0) 64%);
  animation: background-orbit-b 21s linear infinite;
}

#mindmap::before,
#mindmap::after {
  z-index: -1;
}

#mindmap::before {
  bottom: -14vh;
  left: -6vw;
  width: min(28vw, 420px);
  height: min(28vw, 420px);
  background:
    radial-gradient(circle, rgba(224, 239, 233, 0.56) 0%, rgba(224, 239, 233, 0.3) 24%, rgba(224, 239, 233, 0.12) 40%, rgba(255, 255, 255, 0) 64%);
  animation: background-orbit-c 14s linear infinite;
}

#mindmap::after {
  right: -8vw;
  bottom: -16vh;
  width: min(24vw, 360px);
  height: min(24vw, 360px);
  background:
    radial-gradient(circle, rgba(241, 234, 215, 0.52) 0%, rgba(241, 234, 215, 0.28) 24%, rgba(241, 234, 215, 0.12) 40%, rgba(255, 255, 255, 0) 64%);
  animation: background-orbit-d 12s linear infinite;
}

.floating-ui {
  position: absolute;
  inset: 0;
  z-index: 10;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 18px;
  padding: 24px;
  pointer-events: none;
}

.glass-panel {
  border: 1px solid rgba(255, 255, 255, 0.34);
  border-radius: 18px;
  background:
    linear-gradient(180deg, rgba(255, 255, 255, 0.52), rgba(255, 250, 243, 0.24));
  box-shadow:
    0 22px 46px rgba(40, 51, 46, 0.12),
    inset 0 1px 0 rgba(255, 255, 255, 0.72);
  backdrop-filter: blur(22px) saturate(140%);
  -webkit-backdrop-filter: blur(22px) saturate(140%);
}

.title-panel,
.controls {
  pointer-events: auto;
}

.title-panel {
  max-width: min(34rem, calc(100vw - 80px));
  padding: 18px 22px 19px;
}

.controls {
  position: relative;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  align-items: stretch;
  width: min(820px, 66vw);
  min-width: min(680px, 62vw);
  padding: 12px;
  transition:
    width 260ms cubic-bezier(0.22, 1, 0.36, 1),
    min-width 260ms cubic-bezier(0.22, 1, 0.36, 1),
    padding 260ms cubic-bezier(0.22, 1, 0.36, 1);
}

.controls-toggle {
  position: absolute;
  right: 12px;
  top: 12px;
  z-index: 2;
  display: grid;
  place-items: center;
  width: 22px;
  height: 22px;
  padding: 0;
  border: 1px solid rgba(24, 58, 74, 0.14);
  border-radius: 8px;
  color: #183a4a;
  background: rgba(255, 255, 255, 0.38);
  box-shadow: 0 6px 14px rgba(24, 36, 42, 0.08);
  cursor: pointer;
  transition:
    background-color 180ms ease,
    border-color 180ms ease,
    transform 180ms ease;
}

.controls-toggle:hover,
.controls-toggle:focus-visible {
  border-color: rgba(216, 137, 79, 0.42);
  background: rgba(255, 255, 255, 0.62);
}

.controls-toggle:focus-visible {
  outline: 3px solid rgba(216, 137, 79, 0.2);
  outline-offset: 2px;
}

.controls-toggle span {
  font-size: 1rem;
  font-weight: 900;
  line-height: 1;
  transform: translateY(-1px);
}

.controls.collapsed {
  width: 46px;
  min-width: 46px;
  height: 46px;
  padding: 12px;
}

.controls.collapsed .control-main {
  opacity: 0;
  pointer-events: none;
  transform: scale(0.96);
  visibility: hidden;
}

.controls.collapsed .controls-toggle {
  right: 12px;
  top: 12px;
}

.global-view {
  position: absolute;
  left: 24px;
  bottom: 24px;
  z-index: 11;
  width: min(300px, calc(100vw - 48px));
  padding: 12px;
  pointer-events: auto;
  user-select: none;
}

.global-view-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 8px;
  color: #183a4a;
  font-size: 0.76rem;
  font-weight: 900;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.global-view-head strong {
  color: #56636a;
  font-size: 0.78rem;
  font-variant-numeric: tabular-nums;
  letter-spacing: 0;
  text-transform: none;
}

.global-map {
  display: block;
  width: 100%;
  height: 156px;
  border: 1px solid rgba(24, 58, 74, 0.1);
  border-radius: 8px;
  background:
    linear-gradient(180deg, rgba(255, 255, 255, 0.46), rgba(247, 248, 245, 0.28)),
    radial-gradient(circle at 18% 22%, rgba(224, 239, 233, 0.42), transparent 42%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.62);
}

.global-map-link {
  fill: none;
  stroke: rgba(42, 55, 68, 0.22);
  stroke-linecap: round;
  stroke-width: 1.4;
}

.global-map-link.played {
  stroke: rgba(24, 58, 74, 0.52);
  stroke-width: 1.8;
}

.global-map-node {
  pointer-events: none;
  stroke: rgba(24, 58, 74, 0.22);
  stroke-width: 1;
  transition:
    fill 260ms ease,
    opacity 260ms ease,
    stroke 260ms ease;
}

.global-map-node.pending {
  fill: rgba(231, 235, 229, 0.86);
  opacity: 0.5;
}

.global-map-node.played {
  fill: #eef7f3;
  opacity: 0.88;
}

.global-map-node.active {
  fill: #d8894f;
  stroke: rgba(24, 58, 74, 0.42);
  opacity: 1;
}

.global-map-viewport {
  cursor: grab;
  fill: rgba(216, 137, 79, 0.12);
  pointer-events: all;
  stroke: #d8894f;
  stroke-dasharray: 5 4;
  stroke-linejoin: round;
  stroke-width: 2;
  vector-effect: non-scaling-stroke;
}

.global-map-viewport.dragging,
body.global-view-dragging .global-map-viewport {
  cursor: grabbing;
}

.global-progress-track {
  height: 5px;
  margin-top: 9px;
  overflow: hidden;
  border-radius: 999px;
  background: rgba(224, 231, 224, 0.84);
  box-shadow: inset 0 1px 2px rgba(24, 36, 42, 0.1);
}

.global-progress-bar {
  display: block;
  width: 0%;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, #183a4a, #d8894f);
  transition: width 340ms cubic-bezier(0.22, 1, 0.36, 1);
}

#mindmap {
  display: block;
  position: relative;
  z-index: 1;
  overflow: hidden;
  width: 100%;
  height: 100%;
  min-height: 100vh;
  cursor: grab;
  overscroll-behavior: contain;
  touch-action: none;
}

body.canvas-panning #mindmap {
  cursor: grabbing;
}

.map-layer,
.node-layer,
.link-layer {
  position: absolute;
  top: 0;
  left: 0;
  transform-origin: 0 0;
}

.map-layer {
  transition: transform 640ms cubic-bezier(0.22, 1, 0.36, 1);
  will-change: transform;
}

body.global-view-dragging .map-layer {
  transition: none;
}

body.canvas-panning .map-layer {
  transition: none;
}

.node-layer,
.link-layer {
  width: 100%;
  height: 100%;
}

.link-layer {
  overflow: visible;
  pointer-events: none;
}

@keyframes background-orbit-a {
  0% {
    transform: translate3d(0, 0, 0) scale(1);
  }
  25% {
    transform: translate3d(28vw, -4vh, 0) scale(1.08);
  }
  50% {
    transform: translate3d(42vw, 20vh, 0) scale(0.96);
  }
  75% {
    transform: translate3d(10vw, 42vh, 0) scale(1.04);
  }
  100% {
    transform: translate3d(0, 0, 0) scale(1);
  }
}

@keyframes background-orbit-b {
  0% {
    transform: translate3d(0, 0, 0) scale(1);
  }
  25% {
    transform: translate3d(-28vw, -4vh, 0) scale(1.06);
  }
  50% {
    transform: translate3d(-42vw, 19vh, 0) scale(0.93);
  }
  75% {
    transform: translate3d(-10vw, 41vh, 0) scale(1.02);
  }
  100% {
    transform: translate3d(0, 0, 0) scale(1);
  }
}

@keyframes background-orbit-c {
  0% {
    transform: translate3d(0, 0, 0) scale(1);
  }
  25% {
    transform: translate3d(22vw, -34vh, 0) scale(1.08);
  }
  50% {
    transform: translate3d(40vw, -46vh, 0) scale(0.95);
  }
  75% {
    transform: translate3d(12vw, -8vh, 0) scale(1.04);
  }
  100% {
    transform: translate3d(0, 0, 0) scale(1);
  }
}

@keyframes background-orbit-d {
  0% {
    transform: translate3d(0, 0, 0) scale(1);
  }
  25% {
    transform: translate3d(-22vw, -34vh, 0) scale(1.06);
  }
  50% {
    transform: translate3d(-40vw, -44vh, 0) scale(0.95);
  }
  75% {
    transform: translate3d(-12vw, -8vh, 0) scale(1.03);
  }
  100% {
    transform: translate3d(0, 0, 0) scale(1);
  }
}

.node-measurer {
  position: fixed;
  top: -10000px;
  left: -10000px;
  visibility: hidden;
  pointer-events: none;
}

.node-measurer .node-content {
  width: max-content;
}

.mind-node {
  position: absolute;
  top: 0;
  left: 0;
  display: grid;
  place-items: center;
  opacity: 1;
  transform-origin: center;
  cursor: pointer;
  filter: drop-shadow(0 10px 18px rgb(24 38 44 / 0.1));
  transition:
    width 860ms cubic-bezier(0.22, 1, 0.36, 1),
    height 860ms cubic-bezier(0.22, 1, 0.36, 1),
    transform 820ms cubic-bezier(0.22, 1, 0.36, 1),
    opacity 420ms ease;
}

.mind-node.entering {
  opacity: 1;
}

.mind-node.leaving {
  opacity: 0;
}

.node-content {
  display: grid;
  grid-auto-rows: max-content;
  place-items: center;
  gap: 3px;
  width: 100%;
  min-width: 146px;
  min-height: 57px;
  padding: 10px 23px 13px;
  border: 2px solid rgba(26, 42, 49, 0.18);
  border-radius: 8px;
  color: #172033;
  background: #ffffff;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.94);
  line-height: 1.25;
  text-align: center;
  white-space: nowrap;
  transform-origin: center;
  transform: scale(1);
  opacity: 1;
  transition:
    transform 920ms cubic-bezier(0.18, 1.08, 0.32, 1),
    opacity 480ms ease,
    background-color 620ms ease,
    border-color 620ms ease,
    border-width 620ms ease,
    color 620ms ease,
    box-shadow 620ms ease;
}

.node-subtitle {

    <script>
const sourceMarkdown = window.sourceMarkdown;

if (typeof sourceMarkdown !== "string") {
  throw new Error("Mindmap source data was not loaded. Make sure project/source.js is included before index.html script.");
}

const mindmap = document.querySelector("#mindmap");
const mapLayer = document.querySelector("#mapLayer");
const linkLayer = document.querySelector("#linkLayer");
const nodeLayer = document.querySelector("#nodeLayer");
const deckSubtitle = document.querySelector("#deckSubtitle");
const deckTitle = document.querySelector("#deckTitle");
const counter = document.querySelector("#counter");
const controls = document.querySelector(".controls");
const controlsBody = document.querySelector("#controlsBody");
const controlsToggle = document.querySelector("#controlsToggle");
const nodeSlider = document.querySelector("#nodeSlider");
const expandAllButton = document.querySelector("#expandAllButton");
const zoomSlider = document.querySelector("#zoomSlider");
const zoomValue = document.querySelector("#zoomValue");
const activeScaleSlider = document.querySelector("#activeScaleSlider");
const activeScaleValue = document.querySelector("#activeScaleValue");
const nextNodePreview = document.querySelector("#nextNodePreview");
const nextNodeSubtitle = document.querySelector("#nextNodeSubtitle");
const nextNodeTitle = document.querySelector("#nextNodeTitle");
const globalMap = document.querySelector("#globalMap");
const globalMapLinks = document.querySelector("#globalMapLinks");
const globalMapNodes = document.querySelector("#globalMapNodes");
const globalMapViewport = document.querySelector("#globalMapViewport");
const globalProgressText = document.querySelector("#globalProgressText");
const globalProgressBar = document.querySelector("#globalProgressBar");
const imageViewer = createImageViewer();

const SVG_NS = "http://www.w3.org/2000/svg";
const layout = {
  minNodeWidth: 146,
  minNodeHeight: 57,
  pathGap: 99,
  rowGap: 75,
  stagePaddingX: 114,
  stagePaddingY: 72,
  centerBaseline: 520,
  cameraTargetCenterBand: 0.4,
};
const wheelNavigation = {
  threshold: 72,
  idleResetMs: 180,
};
const swipeNavigation = {
  intentDistance: 10,
  minDistance: 56,
  dominanceRatio: 1.25,
};

let activeIndex = 0;
let levelReview = null;
let pendingLevelReviews = [];
let root = parseMarkdownTree(sourceMarkdown);
let preorder = [];
let idToNode = new Map();
let renderedNodes = new Map();
let renderedLinks = new Map();
let currentNodeMetrics = new Map();
let imageConstraints = null;
let cameraZoom = Number(zoomSlider.value) / 100;
let activeScale = Number(activeScaleSlider.value) / 100;
let wheelDeltaBuffer = 0;
let wheelNavigationTimer = null;
let swipeStart = null;

// Canvas panning state
let isPanning = false;
let panStart = null;
let cameraPan = { x: 0, y: 0 };
let isGlobalViewDragging = false;
let globalViewDrag = null;
let globalViewState = null;

assignTreeMetadata(root);
preorder = collectPreorder(root);
idToNode = new Map(preorder.map((node) => [node.id, node]));
nodeSlider.max = String(preorder.length);
updateDeckHeading(root.label);

controlsToggle.addEventListener("click", () => {
  const isCollapsed = controls.classList.toggle("collapsed");
  controlsBody.inert = isCollapsed;
  controlsBody.setAttribute("aria-hidden", String(isCollapsed));
  controlsToggle.setAttribute("aria-expanded", String(!isCollapsed));
  controlsToggle.setAttribute("aria-label", isCollapsed ? "展开控制面板" : "收起控制面板");
  controlsToggle.title = isCollapsed ? "展开控制面板" : "收起控制面板";
  controlsToggle.querySelector("span").textContent = isCollapsed ? "+" : "−";
});
nodeSlider.addEventListener("input", (event) => {
  setActiveIndex(Number(event.target.value));
});
expandAllButton.addEventListener("click", () => {
  setActiveIndex(preorder.length);
});
zoomSlider.addEventListener("input", (event) => {
  cameraZoom = Number(event.target.value) / 100;
  render();
});
activeScaleSlider.addEventListener("input", (event) => {
  activeScale = Number(event.target.value) / 100;
  render();
});
window.addEventListener("keydown", handleKeydown);
window.addEventListener("wheel", handleWheel, { passive: false });
window.addEventListener("resize", () => render());
mindmap.addEventListener("touchstart", handleTouchStart, { passive: true });
mindmap.addEventListener("touchmove", handleTouchMove, { passive: false });
mindmap.addEventListener("touchend", handleTouchEnd, { passive: false });
mindmap.addEventListener("touchcancel", resetSwipeStart);

// Canvas panning events
mindmap.addEventListener("mousedown", handleMouseDown);
globalMapViewport.addEventListener("mousedown", handleGlobalViewportMouseDown);
window.addEventListener("mousemove", handleMouseMove);
window.addEventListener("mouseup", handleMouseUp);

render();

function handleKeydown(event) {
  if (imageViewer.isOpen()) {
    if (event.key === "Escape") {
      event.preventDefault();
      imageViewer.close();
    }
    return;
  }

  const stepByKey = {
    ArrowRight: 1,
    PageDown: 1,
    ArrowLeft: -1,
    PageUp: -1,
  };
  const step = stepByKey[event.key];
  if (step) {
    event.preventDefault();
    navigateByStep(step);
  }
}

function updateCursor() {
  mindmap.style.cursor = isPanning ? "grabbing" : "grab";
}

function handleWheel(event) {
  if (imageViewer.isOpen() || event.ctrlKey || event.metaKey) {
    return;
  }

  const deltaY = normalizeWheelDeltaY(event);
  if (Math.abs(deltaY) < 1) {
    return;
  }

  event.preventDefault();

  // Detect direction change and reset buffer
  if (wheelDeltaBuffer !== 0 && Math.sign(wheelDeltaBuffer) !== Math.sign(deltaY)) {
    wheelDeltaBuffer = 0;
  }

  wheelDeltaBuffer += deltaY;

  // Only move one step per wheel event, regardless of accumulated delta
  if (Math.abs(wheelDeltaBuffer) >= wheelNavigation.threshold) {
    const direction = wheelDeltaBuffer > 0 ? 1 : -1;
    navigateByStep(direction);
    wheelDeltaBuffer = 0;
  }

  scheduleWheelBufferReset();
}

function scheduleWheelBufferReset() {
  window.clearTimeout(wheelNavigationTimer);
  wheelNavigationTimer = window.setTimeout(() => {
    wheelDeltaBuffer = 0;
  }, wheelNavigation.idleResetMs);
}

function normalizeWheelDeltaY(event) {
  if (event.deltaMode === 1) {
    return event.deltaY * 16;
  }
  if (event.deltaMode === 2) {
    return event.deltaY * getViewportSize().height;
  }
  return event.deltaY;
}

function handleTouchStart(event) {
  if (imageViewer.isOpen() || event.touches.length !== 1) {
    resetSwipeStart();
    return;
  }
  const touch = event.touches[0];
  swipeStart = {
    x: touch.clientX,
    y: touch.clientY,
    isVerticalSwipe: false,
  };
}

function handleTouchMove(event) {
  if (!swipeStart || event.touches.length !== 1) {
    return;
  }
  const touch = event.touches[0];
  const dx = touch.clientX - swipeStart.x;
  const dy = touch.clientY - swipeStart.y;
  const isVerticalIntent =
    Math.abs(dy) >= swipeNavigation.intentDistance &&
    Math.abs(dy) > Math.abs(dx) * swipeNavigation.dominanceRatio;
  if (swipeStart.isVerticalSwipe || isVerticalIntent) {
    swipeStart.isVerticalSwipe = true;
    event.preventDefault();
  }
}

function handleTouchEnd(event) {
  if (!swipeStart || event.changedTouches.length === 0) {
    resetSwipeStart();
    return;
  }
  const touch = event.changedTouches[0];
  const dx = touch.clientX - swipeStart.x;
  const dy = touch.clientY - swipeStart.y;
  const isVerticalSwipe =
    swipeStart.isVerticalSwipe &&
    Math.abs(dy) >= swipeNavigation.minDistance &&
    Math.abs(dy) > Math.abs(dx) * swipeNavigation.dominanceRatio;
  if (isVerticalSwipe) {
    event.preventDefault();
    navigateByStep(dy < 0 ? 1 : -1);
  }
  resetSwipeStart();
}

function resetSwipeStart() {
  swipeStart = null;
}

function handleMouseDown(event) {
  if (event.button !== 0 || isInteractivePanTarget(event.target)) {
    return;
  }
  event.preventDefault();
  isPanning = true;
  panStart = { x: event.clientX, y: event.clientY };
  document.body.classList.add("canvas-panning");
  updateCursor();
}

function handleMouseMove(event) {
  if (isGlobalViewDragging) {
    handleGlobalViewportDrag(event);
    return;
  }

  if (!isPanning || !panStart) {
    return;
  }
  const dx = (event.clientX - panStart.x) / cameraZoom;
  const dy = (event.clientY - panStart.y) / cameraZoom;
  cameraPan.x += dx;
  cameraPan.y += dy;
  panStart = { x: event.clientX, y: event.clientY };
  render();
}

function handleMouseUp(event) {
  if (isGlobalViewDragging) {
    finishGlobalViewportDrag();
    return;
  }

  if (event.button !== 0 || !isPanning) {
    return;
  }
  isPanning = false;
  panStart = null;
  document.body.classList.remove("canvas-panning");
  updateCursor();
}

function isInteractivePanTarget(target) {
  return target instanceof Element && Boolean(target.closest("button, input, textarea, select, a"));
}

function handleGlobalViewportMouseDown(event) {
  if (event.button !== 0 || !globalViewState) {
    return;
  }

  event.preventDefault();
  event.stopPropagation();
  isGlobalViewDragging = true;
  globalMapViewport.classList.add("dragging");
  document.body.classList.add("global-view-dragging");

  const pointer = getGlobalMapPointer(event);
  globalViewDrag = {
    pointerOffsetX: pointer.x - globalViewState.viewportRect.x,
    pointerOffsetY: pointer.y - globalViewState.viewportRect.y,
  };
}

function handleGlobalViewportDrag(event) {
  if (!globalViewState || !globalViewDrag) {
    return;
  }

  event.preventDefault();
  const pointer = getGlobalMapPointer(event);
  const desiredMapRect = {
    x: pointer.x - globalViewDrag.pointerOffsetX,
    y: pointer.y - globalViewDrag.pointerOffsetY,
    width: globalViewState.viewportRect.width,
    height: globalViewState.viewportRect.height,
  };
  const clampedMapRect = {
    ...desiredMapRect,
    x: clamp(desiredMapRect.x, 0, Math.max(0, globalViewState.mapSize.width - desiredMapRect.width)),
    y: clamp(desiredMapRect.y, 0, Math.max(0, globalViewState.mapSize.height - desiredMapRect.height)),
  };
  const desiredLogicalViewport = globalViewState.project.unprojectRect(clampedMapRect);

  cameraPan.x = globalViewState.baseViewport.x - desiredLogicalViewport.x;
  cameraPan.y = globalViewState.baseViewport.y - desiredLogicalViewport.y;
  render();
}

function finishGlobalViewportDrag() {
  isGlobalViewDragging = false;
  globalViewDrag = null;
  globalMapViewport.classList.remove("dragging");
  document.body.classList.remove("global-view-dragging");
}

function getGlobalMapPointer(event) {
  const rect = globalMap.getBoundingClientRect();
  const viewBox = globalMap.viewBox.baseVal;
  const widthScale = viewBox.width / Math.max(1, rect.width);
  const heightScale = viewBox.height / Math.max(1, rect.height);

  return {
    x: (event.clientX - rect.left) * widthScale + viewBox.x,
    y: (event.clientY - rect.top) * heightScale + viewBox.y,
  };
}

function parseMarkdownTree(markdown) {
  const stack = [];
  let nextId = 0;
  let parsedRoot = null;

  markdown
    .split("\n")
    .filter((line) => line.trim())
    .forEach((line) => {
      const itemMatch = line.match(/^(\s*)-\s+(.+)$/);
      if (!itemMatch) {
        const continuationMatch = line.match(/^(\s+)(\S.*)$/);
        if (continuationMatch && stack.length > 0) {
          const indent = continuationMatch[1].replace(/\t/g, "    ").length;
          const continuationParent = findContinuationParent(stack, indent);
          const continuationText = continuationMatch[2].trim();

          if (continuationParent) {
            if (continuationText.startsWith("@image ")) {
              continuationParent.image = resolveImagePath(continuationText.slice("@image ".length).trim());
              return;
            }
            continuationParent.label = `${continuationParent.label}\n${continuationText}`;
          }
        }
        return;
      }

      const indent = itemMatch[1].replace(/\t/g, "    ").length;

      while (stack.length > 0 && stack[stack.length - 1].indent >= indent) {
        stack.pop();
      }

      const depth = stack.length;
      const node = {
        id: `node-${nextId++}`,
        label: itemMatch[2].trim(),
        children: [],
        parent: null,
        depth,
        image: "",
        preorderIndex: 0,
      };

      if (depth === 0) {
        parsedRoot = node;
      } else {
        const parent = stack[depth - 1].node;
        node.parent = parent;
        parent.children.push(node);
      }

      stack.push({ node, indent });
    });

  return parsedRoot;
}

function findContinuationParent(stack, indent) {
  for (let index = stack.length - 1; index >= 0; index -= 1) {
    if (stack[index].indent <= indent) {
      return stack[index].node;
    }
  }
  return stack[stack.length - 1]?.node ?? null;
}

function assignTreeMetadata(treeRoot) {
  collectPreorder(treeRoot).forEach((node, index) => {
    node.preorderIndex = index;
  });
}

function resolveImagePath(path) {
  if (/^(https?:|data:|\/|\.\/|\.\.\/)/.test(path)) {
    return path;
  }
  return `./project/${path}`;
}

function clamp(value, min, max) {
  return Math.min(max, Math.max(min, value));
}

function collectPreorder(node, list = []) {
  list.push(node);
  node.children.forEach((child) => collectPreorder(child, list));
  return list;
}

function navigateByStep(step) {
  if (!step) {
    return;
  }

  if (levelReview) {
    levelReview = null;
    if (step < 0) {
      pendingLevelReviews = [];
      render();
      return;
    }

    const nextReview = pendingLevelReviews.shift();
    if (nextReview) {
      levelReview = nextReview;
      render();
      return;
    }

    if (step > 0) {
      setActiveIndex(activeIndex + step);
    }
    return;
  }

  const activeNode = preorder[activeIndex] ?? null;
  const completedLevelReviews = step > 0 ? collectCompletedLevelReviews(activeNode) : [];
  if (completedLevelReviews.length > 0) {
    levelReview = completedLevelReviews.shift();
    pendingLevelReviews = completedLevelReviews;
    render();
    return;
  }

  setActiveIndex(activeIndex + step);
}

function setActiveIndex(index) {
  levelReview = null;
  pendingLevelReviews = [];
  activeIndex = Math.max(0, Math.min(index, preorder.length));
  render();
}

function collectCompletedLevelReviews(node) {
  if (!node || node.children.length > 0) {
    return [];
  }

  const reviews = [];
  let current = node;
  while (current.parent) {
    const parent = current.parent;
    const siblings = parent.children;
    if (siblings[siblings.length - 1] !== current) {
      break;
    }
    if (siblings.length > 1) {
      reviews.push(createLevelReview(parent, node));
    }
    current = parent;
  }
  return reviews;
}

function hasCompletedLevelReviews(node) {
  return collectCompletedLevelReviews(node).length > 0;
}

function createLevelReview(parent, activeNode) {
  return {
    parentId: parent.id,
    activeNodeId: activeNode.id,
  };
}

function render() {
  const activeNode = preorder[activeIndex] ?? null;
  currentNodeMetrics = measureAllNodes(preorder, activeNode);
  const model = activeNode
    ? levelReview
      ? buildLevelReviewModel(activeNode, levelReview)
      : buildVisibleModel(activeNode)
    : buildEndModel();
  const viewport = computeViewport(model);

  syncLinks(model.links);
  syncNodes(model.nodes, activeNode);
  positionMapLayer(viewport, model);
  syncGlobalView(buildEndModel(), viewport);
  updateControls();
}

function measureAllNodes(nodes, activeNode) {
  const measurer = document.createElement("div");
  measurer.className = "node-measurer";
  document.body.appendChild(measurer);

  const metrics = new Map();
  const imageConstraints = computeImageConstraints(nodes);

  nodes.forEach((node) => {
    const content = createNodeContent();
    updateNodeContent(content, node, node.id === activeNode?.id, imageConstraints);
    measurer.appendChild(content.root);

    const rect = content.root.getBoundingClientRect();
    metrics.set(node.id, {
      width: Math.max(layout.minNodeWidth, Math.ceil(rect.width)),
      height: Math.max(layout.minNodeHeight, Math.ceil(rect.height)),
    });

    content.root.remove();
  });

  measurer.remove();
  return metrics;
}

function computeImageConstraints(nodes) {
  const imageNodes = nodes.filter((node) => node.image);
  if (imageNodes.length === 0) {
    return null;
  }

  // Measure all nodes to find reasonable bounds
  const measurer = document.createElement("div");
  measurer.className = "node-measurer";
  document.body.appendChild(measurer);

  const allWidths = [];
  const allHeights = [];
  
  nodes.forEach((node) => {
    const content = createNodeContent();
    // Measure without image first for baseline
    const tempImage = node.image;
    node.image = "";
    updateNodeContent(content, node, false, null);
    measurer.appendChild(content.root);
    const rect = measurer.getBoundingClientRect();
    allWidths.push(rect.width);
    allHeights.push(rect.height);
    measurer.remove();
    node.image = tempImage;
  });

  measurer.remove();

  if (allWidths.length === 0) {
    return null;
  }

  // Sort and find median
  allWidths.sort((a, b) => a - b);
  allHeights.sort((a, b) => a - b);
  
  const medianWidth = allWidths[Math.floor(allWidths.length / 2)] || 200;
  const medianHeight = allHeights[Math.floor(allHeights.length / 2)] || 80;

  // Limit image dimensions to reasonable multiple of typical node size
  return {
    maxWidth: Math.round(medianWidth * 1.8),
    maxHeight: Math.round(medianHeight * 1.6),
  };
}

function buildEndModel() {
  const visibleIds = new Set(preorder.map((node) => node.id));
  const positions = new Map();
  const nodes = [];
  const links = [];
  const rootMetric = getNodeMetric(root);

  placeSubtree(root, visibleIds, positions, {
    x: layout.stagePaddingX + rootMetric.width / 2,
    y: layout.centerBaseline,
  });

  visibleIds.forEach((id) => {
    const node = idToNode.get(id);
    const position = positions.get(id);
    if (!position) {
      return;
    }

    nodes.push({
      id,
      label: node.label,
      x: position.x,
      y: position.y,
      width: getNodeMetric(node).width,
      height: getNodeMetric(node).height,
      depth: node.depth,
      preorderIndex: node.preorderIndex,
      isPath: false,
      isActive: false,
      isComplete: false,
    });

    if (node.parent && positions.has(node.parent.id)) {
      const parentMetric = getNodeMetric(node.parent);
      const nodeMetric = getNodeMetric(node);
      links.push({
        id: `${node.parent.id}->${node.id}`,
        from: positions.get(node.parent.id),
        fromWidth: parentMetric.width,
        to: position,
        toWidth: nodeMetric.width,
        isPathLink: false,
      });
    }
  });

  return { nodes, links, baseline: layout.centerBaseline, isEnd: true };
}

function buildVisibleModel(activeNode) {
  const path = pathToRoot(activeNode);
  const pathIds = new Set(path.map((node) => node.id));
  const visibleIds = new Set(preorder.slice(0, activeIndex + 1).map((node) => node.id));
  const positions = new Map();
  const nodes = [];
  const links = [];
  const completedSubtrees = [];

  path.forEach((node, depthIndex) => {
    const completeChildren = node.children.filter(
      (child) => visibleIds.has(child.id) && !pathIds.has(child.id),
    );

    completeChildren.forEach((child) => {
      completedSubtrees.push({
        child,
        depthIndex,
        height: measureSubtree(child, visibleIds).height,
      });
    });
  });

  const completedHeight =
    completedSubtrees.reduce((total, subtree) => total + subtree.height, 0) +
    Math.max(0, completedSubtrees.length - 1) * layout.rowGap;
  const baseline = layout.centerBaseline;
  let pathCursorX = layout.stagePaddingX;

  path.forEach((node, index) => {
    const metric = getNodeMetric(node);
    positions.set(node.id, {
      x: pathCursorX + metric.width / 2,
      y: baseline,
    });
    pathCursorX += metric.width + layout.pathGap;
  });

  let cursorY = baseline - layout.rowGap - completedHeight;
  completedSubtrees.forEach((subtree) => {
    const parentPosition = positions.get(path[subtree.depthIndex].id);
    const parentMetric = getNodeMetric(path[subtree.depthIndex]);
    const childMetric = getNodeMetric(subtree.child);
    placeSubtree(subtree.child, visibleIds, positions, {
      x: parentPosition.x + parentMetric.width / 2 + layout.pathGap + childMetric.width / 2,
      y: cursorY + subtree.height / 2,
    });
    cursorY += subtree.height + layout.rowGap;
  });

  visibleIds.forEach((id) => {
    const node = idToNode.get(id);
    const position = positions.get(id);
    if (!position) {
      return;
    }

    const isPath = pathIds.has(id);
    nodes.push({
      id,
      label: node.label,
      x: position.x,
      y: position.y,
      width: getNodeMetric(node).width,
      height: getNodeMetric(node).height,
      depth: node.depth,
      preorderIndex: node.preorderIndex,
      isPath,
      isActive: node.id === activeNode.id,
      isComplete: !isPath,
    });

    if (node.parent && positions.has(node.parent.id)) {
      const parentMetric = getNodeMetric(node.parent);
      const nodeMetric = getNodeMetric(node);
      links.push({
        id: `${node.parent.id}->${node.id}`,
        from: positions.get(node.parent.id),
        fromWidth: parentMetric.width,
        to: position,
        toWidth: nodeMetric.width,
        isPathLink: pathIds.has(node.parent.id) && pathIds.has(node.id),
      });
    }
  });

  return { nodes, links, baseline };
}

function buildLevelReviewModel(activeNode, review) {
  const parent = idToNode.get(review.parentId);
  if (!parent || !parent.children.some((child) => isAncestorOrSelf(child, activeNode))) {
    levelReview = null;
    return buildVisibleModel(activeNode);
  }

  const model = buildVisibleModel(activeNode);
  const visibleIds = new Set(model.nodes.map((node) => node.id));
  parent.children.forEach((child) => visibleIds.add(child.id));

  const positions = new Map(model.nodes.map((node) => [node.id, { x: node.x, y: node.y }]));
  const parentPosition = positions.get(parent.id);
  if (!parentPosition) {
    levelReview = null;
    return model;
  }

  const parentMetric = getNodeMetric(parent);
  const childMeasures = parent.children.map((child) => ({
    child,
    height: measureSubtree(child, visibleIds).height,
  }));
  const totalHeight =
    childMeasures.reduce((total, item) => total + item.height, 0) +
    Math.max(0, childMeasures.length - 1) * layout.rowGap;
  let childCursor = parentPosition.y - totalHeight / 2;

  childMeasures.forEach(({ child, height }) => {
    const childMetric = getNodeMetric(child);
    placeSubtree(child, visibleIds, positions, {
      x: parentPosition.x + parentMetric.width / 2 + layout.pathGap + childMetric.width / 2,
      y: childCursor + height / 2,
    });
    childCursor += height + layout.rowGap;
  });

  const pathIds = new Set(pathToRoot(activeNode).map((node) => node.id));
  const nodes = [];
  const links = [];

  visibleIds.forEach((id) => {
    const node = idToNode.get(id);
    const position = positions.get(id);
    if (!node || !position) {
      return;
    }

    const isPath = pathIds.has(id);
    const isReviewSibling = node.parent === parent;
    nodes.push({
      id,
      label: node.label,
      x: position.x,
      y: position.y,
      width: getNodeMetric(node).width,
      height: getNodeMetric(node).height,
      depth: node.depth,
      preorderIndex: node.preorderIndex,
      isPath,
      isActive: node.id === activeNode.id,
      isComplete: !isPath || isReviewSibling,
    });

    if (node.parent && positions.has(node.parent.id)) {
      const linkIsReviewSibling = node.parent === parent;
      links.push({
        id: `${node.parent.id}->${node.id}`,
        from: positions.get(node.parent.id),
        fromWidth: getNodeMetric(node.parent).width,
        to: position,
        toWidth: getNodeMetric(node).width,
        isPathLink: pathIds.has(node.parent.id) && pathIds.has(node.id) && !linkIsReviewSibling,
      });
    }
  });

  return {
    nodes,
    links,
    baseline: model.baseline,
    reviewNodeIds: parent.children.map((child) => child.id),
  };
}

function pathToRoot(node) {
  const path = [];
  let current = node;

  while (current) {
    path.unshift(current);
    current = current.parent;
  }

  return path;
}

function isAncestorOrSelf(ancestor, node) {
  let current = node;
  while (current) {
    if (current === ancestor) {
      return true;
    }
    current = current.parent;
  }
  return false;
}

function measureSubtree(node, visibleIds) {
  const visibleChildren = node.children.filter((child) => visibleIds.has(child.id));
  const metric = getNodeMetric(node);
  if (visibleChildren.length === 0) {
    return { height: metric.height };
  }

  const childHeights = visibleChildren.map((child) => measureSubtree(child, visibleIds).height);
  return {
    height: Math.max(
      metric.height,
      childHeights.reduce((total, height) => total + height, 0) + (childHeights.length - 1) * layout.rowGap,
    ),
  };
}

function placeSubtree(node, visibleIds, positions, anchor) {
  const visibleChildren = node.children.filter((child) => visibleIds.has(child.id));
  positions.set(node.id, { x: anchor.x, y: anchor.y });

  if (visibleChildren.length === 0) {
    return;
  }

  const childMeasures = visibleChildren.map((child) => ({
    child,
    height: measureSubtree(child, visibleIds).height,
  }));
  const totalHeight =
    childMeasures.reduce((total, item) => total + item.height, 0) + (childMeasures.length - 1) * layout.rowGap;

  let childCursor = anchor.y - totalHeight / 2;
  childMeasures.forEach(({ child, height }) => {
    const childY = childCursor + height / 2;
    const nodeMetric = getNodeMetric(node);
    const childMetric = getNodeMetric(child);
    placeSubtree(child, visibleIds, positions, {
      x: anchor.x + nodeMetric.width / 2 + layout.pathGap + childMetric.width / 2,
      y: childY,
    });
    childCursor += height + layout.rowGap;
  });
}

function getNodeMetric(node) {
  return currentNodeMetrics.get(node.id) ?? {
    width: layout.minNodeWidth,
    height: layout.minNodeHeight,
  };
}

function computeViewport(model, targetIndex = null) {
  const viewportSize = getViewportSize();
  const logicalViewport = {
    width: viewportSize.width / cameraZoom,
    height: viewportSize.height / cameraZoom,
  };
  if (model.nodes.length === 0) {
    return { x: 0, y: 0, width: logicalViewport.width, height: logicalViewport.height };
  }

  if (model.isEnd) {
    return computeEndViewport(model, logicalViewport, targetIndex);
  }

  if (model.reviewNodeIds) {
    return computeLevelReviewViewport(model, logicalViewport);
  }

  const pathNodes = model.nodes.filter((node) => node.isPath);
  const pathMinX = Math.min(...pathNodes.map((node) => node.x - node.width / 2));
  const pathMaxX = Math.max(...pathNodes.map((node) => node.x + node.width / 2));
  const pathCenterX = (pathMinX + pathMaxX) / 2;
  const activeNode = model.nodes.find((node) => node.isActive);
  const targetNode =
    targetIndex === null ? activeNode : model.nodes.find((node) => node.preorderIndex === targetIndex) ?? activeNode;
  let viewportX = pathCenterX - logicalViewport.width / 2;
  let viewportY = model.baseline - logicalViewport.height / 2;

  if (targetNode) {
    viewportX = keepNodeInCenterBand(viewportX, logicalViewport.width, targetNode.x, layout.cameraTargetCenterBand);
    viewportY = keepNodeInCenterBand(viewportY, logicalViewport.height, targetNode.y, layout.cameraTargetCenterBand);
  }

  return {
    x: viewportX,
    y: viewportY,
    width: logicalViewport.width,
    height: logicalViewport.height,
  };
}

function computeLevelReviewViewport(model, logicalViewport) {
  const reviewNodes = model.nodes.filter((node) => model.reviewNodeIds.includes(node.id));
  if (reviewNodes.length === 0) {
    return {
      x: 0,
      y: model.baseline - logicalViewport.height / 2,
      width: logicalViewport.width,
      height: logicalViewport.height,
    };
  }

  const bounds = computeModelBounds(reviewNodes);
  const reviewCenterX = (bounds.minX + bounds.maxX) / 2;
  const reviewCenterY = (bounds.minY + bounds.maxY) / 2;

  return {
    x: reviewCenterX - logicalViewport.width / 2,
    y: reviewCenterY - logicalViewport.height / 2,
    width: logicalViewport.width,
    height: logicalViewport.height,
  };
}

function computeEndViewport(model, logicalViewport, targetIndex = null) {
  const bounds = computeModelBounds(model.nodes);
  const graphCenterX = (bounds.minX + bounds.maxX) / 2;
  const graphCenterY = (bounds.minY + bounds.maxY) / 2;
  const targetNode = model.nodes.find((node) => node.preorderIndex === targetIndex);
  let viewportX = graphCenterX - logicalViewport.width / 2;
  let viewportY = graphCenterY - logicalViewport.height / 2;

  if (targetNode) {
    viewportX = keepNodeInCenterBand(viewportX, logicalViewport.width, targetNode.x, layout.cameraTargetCenterBand);
    viewportY = keepNodeInCenterBand(viewportY, logicalViewport.height, targetNode.y, layout.cameraTargetCenterBand);
  }

  return {
    x: viewportX,
    y: viewportY,
    width: logicalViewport.width,
    height: logicalViewport.height,
  };
}

function computeModelBounds(nodes) {
  return nodes.reduce(
    (bounds, node) => ({
      minX: Math.min(bounds.minX, node.x - node.width / 2),
      maxX: Math.max(bounds.maxX, node.x + node.width / 2),
      minY: Math.min(bounds.minY, node.y - node.height / 2),
      maxY: Math.max(bounds.maxY, node.y + node.height / 2),
    }),
    {
      minX: Infinity,
      maxX: -Infinity,
      minY: Infinity,
      maxY: -Infinity,
    },
  );
}

function syncGlobalView(fullModel, viewport) {
  const focusViewport = {
    x: viewport.x - cameraPan.x,
    y: viewport.y - cameraPan.y,
    width: viewport.width,
    height: viewport.height,
  };
  const mapSize = getGlobalMapSize();
  const mapPadding = 14;
  const bounds = computeGlobalViewBounds(fullModel.nodes, focusViewport);
  const project = createGlobalProjector(bounds, mapSize, mapPadding);
  const activeNode = preorder[activeIndex] ?? null;
  const endIndex = preorder.length;
  const progress = endIndex === 0 ? 0 : (activeIndex / endIndex) * 100;

  globalMap.setAttribute("viewBox", `0 0 ${mapSize.width} ${mapSize.height}`);
  globalProgressText.textContent = `${activeIndex + 1} / ${endIndex + 1}`;
  globalProgressBar.style.width = `${progress}%`;

  const linkFragment = document.createDocumentFragment();
  fullModel.links.forEach((link) => {
    const path = document.createElementNS(SVG_NS, "path");
    path.classList.add("global-map-link");
    path.classList.toggle("played", isGlobalLinkPlayed(link));
    path.setAttribute("d", globalLinkPath(link, project));
    linkFragment.appendChild(path);
  });
  globalMapLinks.replaceChildren(linkFragment);

  const nodeFragment = document.createDocumentFragment();
  fullModel.nodes
    .slice()
    .sort((a, b) => a.preorderIndex - b.preorderIndex)
    .forEach((node) => {
      const point = project.point(node.x, node.y);
      const radius = node.id === activeNode?.id ? 4.5 : 3.2;
      const circle = document.createElementNS(SVG_NS, "circle");
      circle.classList.add("global-map-node", getGlobalNodeState(node, activeNode));
      circle.setAttribute("cx", formatNumber(point.x));
      circle.setAttribute("cy", formatNumber(point.y));
      circle.setAttribute("r", formatNumber(radius));
      nodeFragment.appendChild(circle);
    });
  globalMapNodes.replaceChildren(nodeFragment);

  const rect = project.rect(focusViewport);
  globalMapViewport.setAttribute("x", formatNumber(rect.x));
  globalMapViewport.setAttribute("y", formatNumber(rect.y));
  globalMapViewport.setAttribute("width", formatNumber(Math.max(4, rect.width)));
  globalMapViewport.setAttribute("height", formatNumber(Math.max(4, rect.height)));

  globalViewState = {
    baseViewport: viewport,
    focusViewport,
    mapSize,
    project,
    viewportRect: {
      x: rect.x,
      y: rect.y,
      width: Math.max(4, rect.width),
      height: Math.max(4, rect.height),
    },
  };
}

function getGlobalMapSize() {
  const rect = globalMap.getBoundingClientRect();
  return {
    width: Math.max(1, Math.round(rect.width || 300)),
    height: Math.max(1, Math.round(rect.height || 156)),
  };
}

function computeGlobalViewBounds(nodes, viewport) {
  const nodeBounds = nodes.length > 0 ? computeModelBounds(nodes) : {
    minX: 0,
    maxX: viewport.width,
    minY: 0,
    maxY: viewport.height,
  };

  return {
    minX: Math.min(nodeBounds.minX, viewport.x),
    maxX: Math.max(nodeBounds.maxX, viewport.x + viewport.width),
    minY: Math.min(nodeBounds.minY, viewport.y),
    maxY: Math.max(nodeBounds.maxY, viewport.y + viewport.height),
  };
}

function createGlobalProjector(bounds, mapSize, padding) {
  const boundsWidth = Math.max(1, bounds.maxX - bounds.minX);
  const boundsHeight = Math.max(1, bounds.maxY - bounds.minY);
  const drawableWidth = Math.max(1, mapSize.width - padding * 2);
  const drawableHeight = Math.max(1, mapSize.height - padding * 2);
  const scale = Math.min(drawableWidth / boundsWidth, drawableHeight / boundsHeight);
  const offsetX = padding + (drawableWidth - boundsWidth * scale) / 2;
  const offsetY = padding + (drawableHeight - boundsHeight * scale) / 2;

  function point(x, y) {
    return {
      x: offsetX + (x - bounds.minX) * scale,
      y: offsetY + (y - bounds.minY) * scale,
    };
  }

  function rect(box) {
    const origin = point(box.x, box.y);
    return {
      x: origin.x,
      y: origin.y,
      width: box.width * scale,
      height: box.height * scale,
    };
  }

  function unprojectPoint(x, y) {
    return {
      x: (x - offsetX) / scale + bounds.minX,
      y: (y - offsetY) / scale + bounds.minY,
    };
  }

  function unprojectRect(box) {
    const origin = unprojectPoint(box.x, box.y);
    return {
      x: origin.x,
      y: origin.y,
      width: box.width / scale,
      height: box.height / scale,
    };
  }

  return { point, rect, unprojectRect };
}

function globalLinkPath(link, project) {
  const start = project.point(link.from.x + link.fromWidth / 2, link.from.y);
  const end = project.point(link.to.x - link.toWidth / 2, link.to.y);
  const midX = start.x + Math.max(8, (end.x - start.x) * 0.5);

  return `M ${formatNumber(start.x)} ${formatNumber(start.y)} C ${formatNumber(midX)} ${formatNumber(start.y)}, ${formatNumber(midX)} ${formatNumber(end.y)}, ${formatNumber(end.x)} ${formatNumber(end.y)}`;
}

function isGlobalLinkPlayed(link) {
  const [fromId, toId] = link.id.split("->");
  const fromNode = idToNode.get(fromId);
  const toNode = idToNode.get(toId);
  return Boolean(fromNode && toNode && fromNode.preorderIndex <= activeIndex && toNode.preorderIndex <= activeIndex);
}

function getGlobalNodeState(node, activeNode) {
  if (node.id === activeNode?.id) {
    return "active";
  }
  return node.preorderIndex <= activeIndex ? "played" : "pending";
}

function formatNumber(value) {
  return Number.isFinite(value) ? value.toFixed(2) : "0";
}

function keepNodeInCenterBand(viewportStart, viewportSize, nodeCenter, centerBandRatio) {
  const bandPadding = (viewportSize * (1 - centerBandRatio)) / 2;
  const bandStart = viewportStart + bandPadding;
  const bandEnd = viewportStart + viewportSize - bandPadding;

  if (nodeCenter < bandStart) {
    return nodeCenter - bandPadding;
  }
  if (nodeCenter > bandEnd) {
    return nodeCenter - viewportSize + bandPadding;
  }
  return viewportStart;
}

function positionMapLayer(viewport, model) {
  const canvas = computeCanvasSize(model, viewport);

  mapLayer.style.width = `${canvas.width}px`;
  mapLayer.style.height = `${canvas.height}px`;
  linkLayer.setAttribute("viewBox", `0 0 ${canvas.width} ${canvas.height}`);
  mapLayer.style.transform = `scale(${cameraZoom}) translate(${-viewport.x + cameraPan.x}px, ${-viewport.y + cameraPan.y}px)`;
}

function computeCanvasSize(model, viewport) {
  const maxNodeRight = model.nodes.reduce((maxRight, node) => Math.max(maxRight, node.x + node.width / 2), 0);
  const maxNodeBottom = model.nodes.reduce((maxBottom, node) => Math.max(maxBottom, node.y + node.height / 2), 0);

  return {
    width: Math.max(viewport.x + viewport.width, maxNodeRight + layout.stagePaddingX),
    height: Math.max(viewport.y + viewport.height, maxNodeBottom + layout.stagePaddingY),
  };
}

function getViewportSize() {
  return {
    width: Math.max(1, mindmap.clientWidth),
    height: Math.max(1, mindmap.clientHeight),
  };
}

function syncNodes(nodes, activeNode) {
  const liveIds = new Set(nodes.map((node) => node.id));

  renderedNodes.forEach((entry, id) => {
    if (!liveIds.has(id)) {
      entry.group.classList.add("leaving");
      window.clearTimeout(entry.removalTimer);
      entry.removalTimer = window.setTimeout(() => {
        entry.group.remove();
        renderedNodes.delete(id);
      }, 220);
      return;
    }

    if (entry.removalTimer) {
      window.clearTimeout(entry.removalTimer);
      entry.removalTimer = null;
      entry.group.classList.remove("leaving");
    }
  });

  nodes
    .sort((a, b) => a.preorderIndex - b.preorderIndex)
    .forEach((node) => {
      let entry = renderedNodes.get(node.id);
      if (!entry) {
        entry = createNodeElement(node);
        renderedNodes.set(node.id, entry);
        nodeLayer.appendChild(entry.group);
      }

      entry.group.classList.toggle("active", node.isActive);
      entry.group.classList.toggle("path-node", node.isPath);
      entry.group.classList.toggle("complete-node", node.isComplete);
      entry.group.dataset.nodeId = node.id;
      if (activeNode && node.id === activeNode.id) {
        entry.group.setAttribute("aria-current", "true");
      } else {
        entry.group.removeAttribute("aria-current");
      }
      entry.group.setAttribute("aria-label", `查看 ${formatInlineLabel(node.label)} 的视角`);
      entry.group.style.width = `${node.width}px`;
      entry.group.style.height = `${node.height}px`;
      entry.group.style.transform = `translate(${node.x - node.width / 2}px, ${node.y - node.height / 2}px)`;
      updateNodeContent(entry.content, idToNode.get(node.id), node.isActive, imageConstraints);
    });
}

function createNodeElement(node) {
  const group = document.createElement("div");
  group.classList.add("mind-node", "entering");

  const content = createNodeContent();
  updateNodeContent(content, node, node.preorderIndex === activeIndex, null);
  group.append(content.root);
  requestAnimationFrame(() => {
    requestAnimationFrame(() => group.classList.remove("entering"));
  });

  return { group, content, removalTimer: null };
}

function createNodeContent() {
  const content = document.createElement("div");
  content.classList.add("node-content");

  const subtitle = document.createElement("span");
  subtitle.classList.add("node-subtitle");

  const title = document.createElement("span");
  title.classList.add("node-title");

  const imageWrap = document.createElement("button");
  imageWrap.type = "button";
  imageWrap.classList.add("node-image");
  imageWrap.addEventListener("click", (event) => {
    event.stopPropagation();
    const src = imageWrap.dataset.previewSrc;
    if (src) {
      imageViewer.open(src, imageWrap.dataset.previewAlt || "节点插图");
    }
  });
  imageWrap.addEventListener("keydown", (event) => {
    event.stopPropagation();
  });

  const image = document.createElement("img");
  imageWrap.appendChild(image);
  content.append(subtitle, title, imageWrap);

  return { root: content, subtitle, title, imageWrap, image };
}

function updateNodeContent(content, node, isActive, constraints) {
  const [title, ...subtitleLines] = node.label.split("\n");
  const subtitle = subtitleLines.join("\n");

  content.root.classList.toggle("has-subtitle", subtitleLines.length > 0);
  content.root.classList.toggle("has-node-image", Boolean(node.image));
  content.root.classList.toggle("image-expanded", Boolean(node.image) && isActive);
  content.subtitle.textContent = subtitle;
  content.title.textContent = title;

  if (node.image) {
    if (content.image.getAttribute("src") !== node.image) {
      content.image.src = node.image;
    }
    content.image.alt = `${formatInlineLabel(node.label)} 插图`;
    content.imageWrap.disabled = false;
    content.imageWrap.dataset.previewSrc = node.image;
    content.imageWrap.dataset.previewAlt = content.image.alt;
    content.imageWrap.setAttribute("aria-label", `放大查看 ${content.image.alt}`);
    
    // Apply image constraints to limit node size
    if (constraints) {
      content.imageWrap.style.maxWidth = `${constraints.maxWidth}px`;
      content.imageWrap.style.maxHeight = `${constraints.maxHeight}px`;
    } else {
      content.imageWrap.style.maxWidth = "";
      content.imageWrap.style.maxHeight = "";
    }
  } else {
    content.image.removeAttribute("src");
    content.image.alt = "";
    content.imageWrap.disabled = true;
    content.imageWrap.style.maxWidth = "";
    content.imageWrap.style.maxHeight = "";
    delete content.imageWrap.dataset.previewSrc;
    delete content.imageWrap.dataset.previewAlt;
    content.imageWrap.removeAttribute("aria-label");
  }
}

function createImageViewer() {
  const overlay = document.createElement("div");
  overlay.classList.add("image-viewer");
  overlay.setAttribute("aria-hidden", "true");

  const frame = document.createElement("div");
  frame.classList.add("image-viewer-frame");
  frame.setAttribute("role", "dialog");
  frame.setAttribute("aria-modal", "true");
  frame.setAttribute("aria-label", "插图大图预览，点击任意位置关闭");

  const image = document.createElement("img");
  image.classList.add("image-viewer-img");
  let returnFocusTarget = null;

  frame.append(image);
  overlay.append(frame);
  document.body.append(overlay);

  function open(src, alt) {
    returnFocusTarget = document.activeElement;
    image.src = src;
    image.alt = alt;
    overlay.classList.add("open");
    overlay.setAttribute("aria-hidden", "false");
    document.body.classList.add("image-viewer-open");
  }

  function close() {
    overlay.classList.remove("open");
    overlay.setAttribute("aria-hidden", "true");
    document.body.classList.remove("image-viewer-open");
    if (returnFocusTarget && document.contains(returnFocusTarget)) {
      returnFocusTarget.focus();
    }
    returnFocusTarget = null;
  }

  overlay.addEventListener("click", close);

  return {
    open,
    close,
    isOpen: () => overlay.classList.contains("open"),
  };
}

function syncLinks(links) {
  const liveIds = new Set(links.map((link) => link.id));

  renderedLinks.forEach((entry, id) => {
    if (!liveIds.has(id)) {
      entry.path.classList.add("leaving");
      window.clearTimeout(entry.removalTimer);
      entry.removalTimer = window.setTimeout(() => {
        entry.path.remove();
        renderedLinks.delete(id);
      }, 220);
      return;
    }

    if (entry.removalTimer) {
      window.clearTimeout(entry.removalTimer);
      entry.removalTimer = null;
      entry.path.classList.remove("leaving");
    }
  });

  links.forEach((link) => {
    let entry = renderedLinks.get(link.id);
    if (!entry) {
      const path = document.createElementNS(SVG_NS, "path");
      path.classList.add("mind-link", "entering");
      path.setAttribute("pathLength", "1");
      entry = { path, removalTimer: null };
      renderedLinks.set(link.id, entry);
      linkLayer.appendChild(path);
      window.setTimeout(() => path.classList.remove("entering"), 980);
    }

    entry.path.classList.toggle("path-link", link.isPathLink);
    entry.path.setAttribute("d", linkPath(link));
  });
}

function linkPath(link) {
  const startX = link.from.x + link.fromWidth / 2;
  const startY = link.from.y;
  const endX = link.to.x - link.toWidth / 2;
  const endY = link.to.y;
  const midX = startX + Math.max(36, (endX - startX) * 0.5);

  return `M ${startX} ${startY} C ${midX} ${startY}, ${midX} ${endY}, ${endX} ${endY}`;
}

function updateControls() {
  const activeNode = preorder[activeIndex];
  const nextNode = preorder[activeIndex + 1];
  const endIndex = preorder.length;
  const isEnd = activeIndex === endIndex;
  const sliderProgress = endIndex === 0 ? 0 : (activeIndex / endIndex) * 100;
  const label = getNextStepLabel(nextNode, isEnd, activeNode);

  counter.textContent = `${activeIndex + 1} / ${endIndex + 1}`;
  nodeSlider.value = String(activeIndex);
  nodeSlider.style.setProperty("--slider-progress", `${sliderProgress}%`);
  expandAllButton.disabled = isEnd;
  expandAllButton.setAttribute("aria-disabled", String(isEnd));
  zoomSlider.value = String(Math.round(cameraZoom * 100));
  zoomValue.textContent = `${Math.round(cameraZoom * 100)}%`;
  activeScaleSlider.value = String(Math.round(activeScale * 100));
  activeScaleValue.textContent = `${activeScale.toFixed(2)}x`;
  nodeLayer.style.setProperty("--active-node-scale", activeScale.toFixed(2));
  nextNodePreview.classList.toggle("has-subtitle", label.hasSubtitle);
  nextNodeSubtitle.textContent = label.subtitle;
  nextNodeTitle.textContent = label.title;
}

function getNextStepLabel(nextNode, isEnd, activeNode) {
  if (!levelReview && hasCompletedLevelReviews(activeNode)) {
    return {
      hasSubtitle: true,
      subtitle: "下一步",
      title: "当前层级回顾",
    };
  }

  if (isEnd) {
    return {
      hasSubtitle: true,
      subtitle: "当前",
      title: "结束总览",
    };
  }

  if (nextNode) {
    return splitLabel(nextNode.label);
  }

  return {
    hasSubtitle: true,
    subtitle: "下一步",
    title: "结束总览",
  };
}

function updateDeckHeading(label) {
  const heading = splitLabel(label);
  deckSubtitle.textContent = heading.subtitle || "Mindmap PPT";
  deckTitle.textContent = heading.title;
}

function formatInlineLabel(label) {
  return label.replace(/\s*\n\s*/g, " / ");
}

function splitLabel(label) {
  const [title, ...subtitleLines] = label.split("\n");
  const subtitle = subtitleLines.join("\n");
  const hasSubtitle = subtitleLines.length > 0;

  return {
    hasSubtitle,
    subtitle,
    title,
  };
}
